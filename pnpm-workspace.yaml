packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: false

# Keep transitive runtime/development parsers outside the reviewed advisory ranges.
overrides:
  brace-expansion: 5.0.12
  ip-address: 10.7.1
  proxy-addr: 2.0.8
  qs: 6.16.0
  shell-quote: 1.11.0
  source-map-js: 1.2.2

patchedDependencies:
  "@colyseus/sdk@0.17.43": patches/@colyseus__sdk@0.17.43.patch
