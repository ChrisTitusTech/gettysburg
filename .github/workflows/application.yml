name: Application

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    # Two sequential games can each take eight minutes, in addition to all gates.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: gettysburg_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: gettysburg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gettysburg -d gettysburg_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version: 24.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Install encrypted-backup test tools
        run: sudo apt-get update && sudo apt-get install --yes age

      - name: Test
        run: pnpm test

      # Keep database restart/revocation checks out of concurrent workspace load.
      - name: Test PostgreSQL durability
        env:
          GETTYSBURG_POSTGRES_TEST_URL: postgresql://gettysburg@127.0.0.1:5432/gettysburg_test
        run:
          pnpm --filter @gettysburg/server exec vitest run
          src/postgres.integration.test.ts

      - name: Build
        run: pnpm build

      - name: Install Chromium for browser acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: Run two-player and full enforced-game browser acceptance
        env:
          GETTYSBURG_FULL_GAME: "true"
          # Shared-runner timings are diagnostics, not calibrated desktop acceptance.
          GETTYSBURG_PERFORMANCE_MODE: report
        run: pnpm browser:acceptance

      - name: Verify mandatory movement inputs in browser fixtures
        run: pnpm browser:movement

      - name: Smoke-test startup and readiness
        run: timeout 45s pnpm smoke

      - name: Build and smoke-test the non-root container
        env:
          GETTYSBURG_CONTAINER_ENGINE: docker
        run: pnpm container:smoke
