name: Browser compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: browser-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Validate ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
          version: 11.21.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24.13.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser engines and host libraries
        # The notification-worker fixture uses a separate Chromium context.
        run:
          pnpm exec playwright install --with-deps chromium ${{ matrix.browser
          }}
      - name: Run both layouts and full enforced games
        env:
          GETTYSBURG_BROWSER: ${{ matrix.browser }}
          GETTYSBURG_FULL_GAME: "true"
          # Keep misses visible without treating this shared VM as desktop hardware.
          GETTYSBURG_PERFORMANCE_MODE: report
          GETTYSBURG_CONTAINER_ENGINE: docker
          GETTYSBURG_EVIDENCE_DIR: test-results/${{ matrix.browser }}
        run: pnpm browser:acceptance
