services:
  db:
    image: docker.io/library/postgres@sha256:d326bec58d3de8d239df60475941522342723934a2598ae59a0281f077681462
    environment:
      POSTGRES_DB: gettysburg
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: gettysburg
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U gettysburg -d gettysburg
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    security_opt:
      - no-new-privileges
    tmpfs:
      - /run/postgresql
      - /tmp
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Containerfile
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gettysburg@db:5432/gettysburg
      GETTYSBURG_CREDENTIAL_PEPPER_FILE: /var/lib/gettysburg/credential-pepper
      GETTYSBURG_SERVER_HOST: 0.0.0.0
      GETTYSBURG_SERVER_PORT: 3000
      GETTYSBURG_TRUSTED_ORIGIN: http://127.0.0.1:8080
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 2s
      retries: 5
    read_only: true
    security_opt:
      - no-new-privileges
    tmpfs:
      - /tmp
    volumes:
      - app_state:/var/lib/gettysburg

  proxy:
    build:
      context: .
      dockerfile: ops/Containerfile.caddy
    cap_drop:
      - ALL
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges
    tmpfs:
      - /config
      - /data
      - /tmp
    user: "1000:1000"
    volumes:
      - ./ops/Caddyfile.local:/etc/caddy/Caddyfile:ro

volumes:
  app_state:
  postgres_data:
