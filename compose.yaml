services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    cap_drop:
      - ALL
    environment:
      GETTYSBURG_SERVER_HOST: 0.0.0.0
      GETTYSBURG_SERVER_PORT: 3000
      GETTYSBURG_TRUSTED_ORIGIN: http://127.0.0.1:8080
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 2s
      retries: 5
    read_only: true
    security_opt:
      - no-new-privileges
    tmpfs:
      - /tmp

  proxy:
    build:
      context: .
      dockerfile: ops/Containerfile.caddy
    cap_drop:
      - ALL
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges
    tmpfs:
      - /config
      - /data
      - /tmp
    user: "1000:1000"
    volumes:
      - ./ops/Caddyfile.local:/etc/caddy/Caddyfile:ro
